<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwiftCart</title>

    <!-- Tailwind + DaisyUI CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Fonts CDN -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome CDN -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Style Sheet Link -->
    <link rel="stylesheet" href="./Styles/style.css" />
  </head>
  <body>
    <header class="shadow-sm">
      <nav class="max-w-[80%] mx-auto">
        <div class="navbar">
          <div class="navbar-start">
            <div class="dropdown">
              <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h8m-8 6h16"
                  />
                </svg>
              </div>
              <ul
                tabindex="-1"
                class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow"
              >
                <li><a>Item 1</a></li>
                <li>
                  <a>Parent</a>
                  <ul class="p-2">
                    <li><a>Submenu 1</a></li>
                    <li><a>Submenu 2</a></li>
                  </ul>
                </li>
                <li><a>Item 3</a></li>
              </ul>
            </div>
            <a class="btn btn-ghost text-2xl text-[#4F39F6]">SwiftCart</a>
          </div>
          <div class="navbar-center hidden lg:flex">
            <ul
              class="menu-horizontal text-gray-500 px-1 font-semibold space-x-2"
            >
              <li>
                <a href="" class="p-2 rounded hover:text-[#4F39F6]">Home</a>
              </li>
              <li>
                <a href="" class="p-2 rounded hover:text-[#4F39F6]">Products</a>
              </li>
              <li>
                <a href="" class="p-2 rounded hover:text-[#4F39F6]">About</a>
              </li>
              <li>
                <a href="" class="p-2 rounded hover:text-[#4F39F6]"> Contacts </a>
              </li>
            </ul>
          </div>
          <div class="navbar-end">
            <button class="opacity-80"><i class="fa-solid fa-cart-shopping"></i></button>
          </div>
        </div>
      </nav>
    </header>
  </body>
</html>
